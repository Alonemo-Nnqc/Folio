<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="actionTitle">Save to Folio</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icon-32.png" alt="" width="20" height="20">
    <h1 data-i18n="actionTitle">Save to Folio</h1>
    <span id="connection" class="connection" hidden></span>
  </header>

  <div id="update" class="banner" hidden></div>

  <main id="loading" class="state">
    <div class="spinner" aria-hidden="true"></div>
    <p class="secondary" id="loading-text" data-i18n="loadingPage">Reading the page…</p>
  </main>

  <main id="offline" class="state" hidden>
    <div class="symbol">⚠︎</div>
    <h2 data-i18n="offlineTitle">Can't Connect to Folio</h2>
    <p class="secondary" data-i18n="offlineDetail"></p>
    <div class="buttons centered">
      <button id="retry" type="button" data-i18n="retry">Retry</button>
      <button id="launch" type="button" class="primary" data-i18n="openFolio">Open Folio</button>
    </div>
  </main>

  <main id="form" hidden>
    <section class="card" data-i18n-aria-label="detectedWork">
      <div class="kind" id="kind"></div>
      <div class="title" id="title"></div>
      <div class="meta secondary" id="meta"></div>
      <div class="note" id="note" hidden></div>
    </section>

    <section id="multi" class="multi" data-i18n-aria-label="worksOnPage" hidden>
      <div class="multi-header">
        <label class="check"><input id="select-all" type="checkbox" checked><span id="multi-count"></span></label>
      </div>
      <ul id="candidates" class="candidates"></ul>
    </section>

    <label class="field">
      <span data-i18n="group">Group</span>
      <select id="group"></select>
    </label>

    <label class="field">
      <span data-i18n="tags">Tags</span>
      <input id="tags" type="text" data-i18n-placeholder="tagsPlaceholder" list="tag-list" autocomplete="off">
      <datalist id="tag-list"></datalist>
    </label>

    <label class="check indented" id="pdf-row" hidden>
      <input id="pdf" type="checkbox" checked>
      <span id="pdf-label" data-i18n="savePDFToo">Also save the PDF</span>
    </label>

    <div class="buttons">
      <button id="cancel" type="button" data-i18n="cancel">Cancel</button>
      <button id="save" type="button" class="primary" data-i18n="save">Save</button>
    </div>
  </main>

  <main id="done" class="state" hidden>
    <div class="symbol success" id="done-symbol">✓</div>
    <h2 id="done-title" data-i18n="saved">Saved</h2>
    <p class="secondary" id="done-detail"></p>
    <p class="pdf-status" id="pdf-status" hidden></p>
    <ul class="failures" id="failures" hidden></ul>
    <div class="buttons centered">
      <button id="reveal" type="button" data-i18n="revealInFolio">Show in Folio</button>
      <button id="close" type="button" class="primary" data-i18n="done">Done</button>
    </div>
  </main>

  <script src="connector.js" charset="utf-8"></script>
  <script src="popup.js" charset="utf-8"></script>
</body>
</html>
