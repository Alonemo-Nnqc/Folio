<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folio Reader</title>
  <link rel="stylesheet" href="../../Assets/pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <aside id="sidebar">
    <nav id="sidebarTabs">
      <button data-pane="thumbnails" class="active">&#xE8A9;</button>
      <button data-pane="outline">&#xE8FD;</button>
      <button data-pane="annotations">&#xE70F;</button>
      <button data-pane="hits">&#xE721;</button>
    </nav>
    <section id="thumbnails" class="pane active"></section>
    <section id="outline" class="pane"></section>
    <section id="annotations" class="pane"></section>
    <section id="hits" class="pane"></section>
  </aside>
  <div id="sidebarDivider"></div>
  <div id="viewerContainer">
    <div id="viewer" class="pdfViewer"></div>
  </div>
  <div id="message" hidden></div>
  <div id="tip" hidden></div>
  <div id="printContainer"></div>
  <script type="module" src="viewer.js"></script>
</body>
</html>
