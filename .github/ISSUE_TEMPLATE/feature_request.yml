name: 功能建议 / Feature request
description: 建议新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在什么场景下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 设想的方案
      description: 你希望 Folio 怎样做？可以参考其他软件的做法。
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案或补充
