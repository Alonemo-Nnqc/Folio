name: CI (Windows)

# Folio for Windows (windows/): core tests on Windows, and the app built for x64 and ARM64.
on:
  push:
    branches: [main]
    paths: ['windows/**', 'BrowserExtension/**', 'macos/Folio/Resources/Localizable.xcstrings', 'macos/Packages/FolioCore/Sources/**', '.github/workflows/ci-windows.yml']
  pull_request:
    paths: ['windows/**', 'BrowserExtension/**', 'macos/Folio/Resources/Localizable.xcstrings', 'macos/Packages/FolioCore/Sources/**', '.github/workflows/ci-windows.yml']
  workflow_dispatch:

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: Core tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test
        working-directory: windows
        run: dotnet test --project tests/Folio.Core.Tests

  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build windows/src/Folio.App/Folio.App.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
