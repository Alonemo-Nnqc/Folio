name: CI (Windows)

# Folio for Windows (windows/): core tests on Windows, and the app built for x64 and ARM64.
on:
  push:
    branches: [main, feat/windows, feat/windows-webui]
    paths: ['windows/**', 'BrowserExtension/**', 'macos/Folio/Resources/Localizable.xcstrings', 'macos/Packages/FolioCore/Sources/**', '.github/workflows/ci-windows.yml']
  pull_request:
    paths: ['windows/**', 'BrowserExtension/**', 'macos/Folio/Resources/Localizable.xcstrings', 'macos/Packages/FolioCore/Sources/**', '.github/workflows/ci-windows.yml']
  workflow_dispatch:

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: Core tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test
        working-directory: windows
        run: dotnet test --project tests/Folio.Core.Tests

  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the interface
        shell: pwsh
        run: |
          corepack enable
          pnpm --dir windows/web install --frozen-lockfile
          pnpm --dir windows/web build

      - name: Build
        run: dotnet build windows/src/Folio.Desktop/Folio.Desktop.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}

      # The same publish as the release (release.yml), to catch what only a self-contained publish breaks.
      - name: Publish (trial)
        shell: pwsh
        run: |
          dotnet publish windows/src/Folio.Desktop/Folio.Desktop.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -p:Version=0.0.1 -o publish
          # folio-cli (the AI interface) ships next to Folio.exe.
          dotnet publish windows/src/Folio.Cli/Folio.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:Version=0.0.1 -o publish
          if (-not (Test-Path publish/folio-cli.exe)) { throw "folio-cli.exe missing" }
