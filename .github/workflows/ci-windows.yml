name: CI (Windows)

# Folio for Windows (windows/): core tests on Windows, and the app built for x64 and ARM64.
on:
  push:
    branches: [main, feat/windows]
    paths: ['windows/**', 'BrowserExtension/**', 'macos/Folio/Resources/Localizable.xcstrings', 'macos/Packages/FolioCore/Sources/**', '.github/workflows/ci-windows.yml']
  pull_request:
    paths: ['windows/**', 'BrowserExtension/**', 'macos/Folio/Resources/Localizable.xcstrings', 'macos/Packages/FolioCore/Sources/**', '.github/workflows/ci-windows.yml']
  workflow_dispatch:

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: Core tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test
        working-directory: windows
        run: dotnet test --project tests/Folio.Core.Tests

  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build windows/src/Folio.App/Folio.App.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}

      # The same packaging as release-windows.yml, uploaded as a build artifact (nothing is published).
      - name: Package (trial)
        shell: pwsh
        run: |
          dotnet publish windows/src/Folio.App/Folio.App.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -p:Version=0.0.1 -o publish
          # folio-cli (the AI interface) ships next to Folio.exe.
          dotnet publish windows/src/Folio.Cli/Folio.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:Version=0.0.1 -o publish
          if (-not (Test-Path publish/folio-cli.exe)) { throw "folio-cli.exe missing" }
          dotnet tool install -g vpk --version 1.2.161
          vpk pack --packId Folio --packVersion 0.0.1-ci.${{ github.run_number }} --packDir publish --mainExe Folio.exe --packTitle Folio --packAuthors Folio `
            --icon windows/src/Folio.App/Assets/Folio.ico --channel ${{ matrix.rid }} --runtime ${{ matrix.rid }} --outputDir releases
          Get-ChildItem releases

      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.rid }}-trial
          path: releases/
          retention-days: 7
