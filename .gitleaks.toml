# Secret scanning (gitleaks). The default rules, plus known false positives.
[extend]
useDefault = true

# `[allowlist]`, not `[[allowlists]]`: CI's gitleaks (8.24) ignores the newer table, and newer versions still read this one.
[allowlist]
description = "Chrome extension public key: pins the unpacked extension's ID, not a secret"
paths = ['''BrowserExtension/chromium/manifest\.json''']
