name: Folio
options:
  bundleIdPrefix: com.nnqc
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: 2WJC7GTSV4
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
packages:
  FolioCore:
    path: Packages/FolioCore
targets:
  Folio:
    type: application
    platform: macOS
    sources:
      - path: Folio
    dependencies:
      - package: FolioCore
        product: FolioCore
      - package: FolioCore
        product: FolioMetadata
      - package: FolioCore
        product: FolioCitation
      - package: FolioCore
        product: FolioZotero
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nnqc.Folio
        PRODUCT_NAME: Folio
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Folio/Info.plist
        CODE_SIGN_ENTITLEMENTS: Folio/Folio.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  FolioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FolioTests
      - path: Folio/Views/Sidebar/SidebarDragRules.swift
      - path: Folio/Views/ItemList/ItemMenuBuilder.swift
      - path: Folio/App/CitationStyleOption.swift
      - path: Folio/Support/AppKitExtensions.swift
    dependencies:
      - package: FolioCore
        product: FolioCore
      - package: FolioCore
        product: FolioCitation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nnqc.FolioTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
  FolioUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: FolioUITests
    dependencies:
      - target: Folio
      - package: FolioCore
        product: FolioCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nnqc.FolioUITests
        TEST_TARGET_NAME: Folio
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Folio:
    build:
      targets:
        Folio: all
        FolioUITests: [test]
        FolioTests: [test]
    test:
      targets:
        - FolioTests
        - FolioUITests
